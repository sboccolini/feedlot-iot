- id: '1779134219872'
  alias: Encender luces manga
  triggers:
  - trigger: time
    at: '20:00:00'
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: feedlot/iluminacion/manga/set
      payload: 'ON'
  mode: single
- id: '1779134221405'
  alias: Apagar luces manga
  triggers:
  - trigger: time
    at: 06:00:00
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: feedlot/iluminacion/manga/set
      payload: 'OFF'
  mode: single
- id: '1779301070601'
  alias: Alerta corte eléctrico
  triggers:
  - trigger: mqtt
    options:
      topic: feedlot/energia/red_220v
      payload: CORTE
  conditions:
  - condition: state
    entity_id: input_boolean.alerta_corte_activa
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alerta_corte_activa
  - action: persistent_notification.create
    data:
      message: Se cortó el suministro de 220V en el feedlot
      title: ⚡ Corte eléctrico
      notification_id: alerta_corte_electrico
  - action: telegram_bot.send_message
    data:
      target: 1185960621
      message: ⚡ Corte eléctrico en el feedlot — Se cortó el suministro de 220V
  - action: notify.mobile_app_iphone1
    metadata: {}
    data:
      message: corte electrico
      title: CORTE ELECTRICO
  mode: single
