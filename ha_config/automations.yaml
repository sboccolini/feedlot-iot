- id: '1779301070605'
  alias: Alerta nivel tanque bajo
  description: ''
  triggers:
  - trigger: mqtt
    topic: feedlot/tanque/nivel
  conditions:
  - condition: template
    value_template: '{{ trigger.payload | float(0) < 20 }}'
  - condition: state
    entity_id: input_boolean.alerta_tanque_activa
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alerta_tanque_activa
  - action: notify.mobile_app_cph2655
    metadata: {}
    data:
      title: NIVEL TANQUE BAJO
      message: El nivel del tanque esta por de bajo del 20%
  - action: notify.mobile_app_iphone1
    metadata: {}
    data:
      message: El nivel del tanque esta por de bajo del 20%
      title: NIVEL TANQUE BAJO
  - action: notify.mobile_app_eltacho
    metadata: {}
    data:
      message: El nivel del tanque esta por de bajo del 20%
      title: NIVEL TANQUE BAJO
  mode: single
