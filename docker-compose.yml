version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: broker_mqtt
    ports: ["1883:1883", "9001:9001"]
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: always

  nodered:
    image: nodered/node-red:latest
    container_name: cerebro_nodered
    ports: ["1880:1880"]
    volumes: ["./nodered_data:/data"]
    depends_on: [mosquitto, influxdb]
    restart: always

  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: ui_homeassistant
    network_mode: host
    environment: [TZ=America/Argentina/Cordoba]
    volumes: ["./ha_config:/config"]
    depends_on: [mosquitto]
    restart: always

  influxdb:
    image: influxdb:2.0
    container_name: db_influx
    ports: ["8086:8086"]
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=feedlot2026
      - DOCKER_INFLUXDB_INIT_ORG=feedlot
      - DOCKER_INFLUXDB_INIT_BUCKET=feedlot
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=feedlot-token-2026
    volumes: ["./influxdb_data:/var/lib/influxdb2"]
    restart: always
